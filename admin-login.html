<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DN Center | Admin Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 420px;
            width: 100%;
            padding: 3rem 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-header i {
            font-size: 4rem;
            color: #667eea;
            margin-bottom: 1rem;
        }

        .login-header h1 {
            color: #2d3748;
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: #718096;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #4a5568;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 1.1rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 3rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .login-button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 0.875rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .error-message.show {
            display: flex;
        }

        .forgot-password {
            text-align: center;
            margin-top: 1.5rem;
        }

        .forgot-password a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .forgot-password a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .back-link {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e2e8f0;
        }

        .back-link a {
            color: #718096;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-link a:hover {
            color: #667eea;
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div>
        <div class="login-container">
            <div class="login-header">
                <i class="fas fa-shield-alt"></i>
                <h1>เข้าสู่ระบบผู้ดูแล</h1>
                <p>DN Center Booking System</p>
            </div>

            <div class="error-message" id="login-error">
                <i class="fas fa-exclamation-circle"></i>
                <span>ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</span>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">ชื่อผู้ใช้</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">รหัสผ่าน</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="กรอกรหัสผ่าน" required>
                    </div>
                </div>

                <button type="submit" class="login-button">
                    <i class="fas fa-sign-in-alt"></i>
                    เข้าสู่ระบบ
                </button>
            </form>

            <div class="forgot-password">
                <a href="#" id="forgot-password-link">ลืมรหัสผ่าน?</a>
            </div>

            <div class="back-link">
                <a href="index.html">
                    <i class="fas fa-arrow-left"></i>
                    กลับสู่หน้าจอง
                </a>
            </div>
        </div>

        <div class="footer">
            © 2025 DN CENTER 2019 CO., LTD. | IT Support Department
        </div>
    </div>

    <script>
        // MD5 hash function
        function md5(string) {
            function rotateLeft(value, shift) {
                return (value << shift) | (value >>> (32 - shift));
            }
            function addUnsigned(x, y) {
                const lsw = (x & 0xFFFF) + (y & 0xFFFF);
                const msw = (x >> 16) + (y >> 16) + (lsw >> 16);
                return (msw << 16) | (lsw & 0xFFFF);
            }
            function f(x, y, z) { return (x & y) | (~x & z); }
            function g(x, y, z) { return (x & z) | (y & ~z); }
            function h(x, y, z) { return x ^ y ^ z; }
            function i(x, y, z) { return y ^ (x | ~z); }
            function transform(func, a, b, c, d, x, s, ac) {
                a = addUnsigned(a, addUnsigned(addUnsigned(func(b, c, d), x), ac));
                return addUnsigned(rotateLeft(a, s), b);
            }
            function convertToWordArray(string) {
                let words = [];
                const messageLength = string.length;
                const numberOfWords = (((messageLength + 8) >>> 6) + 1) << 4;
                for (let i = 0; i < numberOfWords; i++) words[i] = 0;
                for (let i = 0; i < messageLength; i++) {
                    words[i >>> 2] |= (string.charCodeAt(i) & 0xFF) << ((i % 4) * 8);
                }
                return words;
            }
            const words = convertToWordArray(string);
            const wordCount = words.length;
            words[wordCount - 14] = string.length << 3;
            words[wordCount - 13] = string.length >>> 29;
            let a = 0x67452301, b = 0xEFCDAB89, c = 0x98BADCFE, d = 0x10325476;
            for (let q = 0; q < wordCount; q += 16) {
                let aa = a, bb = b, cc = c, dd = d;
                const S = [7,12,17,22,5,9,14,20,4,11,16,23,6,10,15,21];
                const T = [0xD76AA478,0xE8C7B756,0x242070DB,0xC1BDCEEE,0xF57C0FAF,0x4787C62A,0xA8304613,0xFD469501,0x698098D8,0x8B44F7AF,0xFFFF5BB1,0x895CD7BE,0x6B901122,0xFD987193,0xA679438E,0x49B40821,0xF61E2562,0xC040B340,0x265E5A51,0xE9B6C7AA,0xD62F105D,0x02441453,0xD8A1E681,0xE7D3FBC8,0x21E1CDE6,0xC33707D6,0xF4D50D87,0x455A14ED,0xA9E3E905,0xFCEFA3F8,0x676F02D9,0x8D2A4C8A,0xFFFA3942,0x8771F681,0x6D9D6122,0xFDE5380C,0xA4BEEA44,0x4BDECFA9,0xF6BB4B60,0xBEBFBC70,0x289B7EC6,0xEAA127FA,0xD4EF3085,0x04881D05,0xD9D4D039,0xE6DB99E5,0x1FA27CF8,0xC4AC5665,0xF4292244,0x432AFF97,0xAB9423A7,0xFC93A039,0x655B59C3,0x8F0CCC92,0xFFEFF47D,0x85845DD1,0x6FA87E4F,0xFE2CE6E0,0xA3014314,0x4E0811A1,0xF7537E82,0xBD3AF235,0x2AD7D2BB,0xEB86D391];
                for (let k = 0; k < 64; k++) {
                    const func = k < 16 ? f : k < 32 ? g : k < 48 ? h : i;
                    const idx = k < 16 ? k : k < 32 ? (5 * k + 1) % 16 : k < 48 ? (3 * k + 5) % 16 : (7 * k) % 16;
                    const temp = d; d = c; c = b; b = transform(func, b, c, d, a, words[q + idx], S[k % 4 + (Math.floor(k / 16) * 4)], T[k]); a = temp;
                }
                a = addUnsigned(a, aa); b = addUnsigned(b, bb); c = addUnsigned(c, cc); d = addUnsigned(d, dd);
            }
            function wordToHex(value) {
                let hex = '', byte;
                for (let i = 0; i < 4; i++) {
                    byte = (value >>> (i * 8)) & 0xFF;
                    hex += ('0' + byte.toString(16)).slice(-2);
                }
                return hex;
            }
            return wordToHex(a) + wordToHex(b) + wordToHex(c) + wordToHex(d);
        }

        // Admin credentials (MD5 hashed)
        const ADMIN_CREDENTIALS = [
            {
                username: 'sawitree',
                passwordHash: 'a6e510fff1a813aa275985532021a5db'
            },
            {
                username: 'chaiyapat',
                passwordHash: 'c1fa0ba09f9b2a0371ea9682297c9fec'
            }
        ];

        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');

        // Handle login
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const passwordHash = md5(password);

            // Check against all admin credentials
            const validUser = ADMIN_CREDENTIALS.find(cred =>
                cred.username === username && cred.passwordHash === passwordHash
            );

            if (validUser) {
                // Success - set session and redirect
                sessionStorage.setItem('dn-admin-auth', Date.now());
                sessionStorage.setItem('dn-admin-username', username);
                window.location.href = 'admin.html';
            } else {
                // Error
                loginError.classList.add('show');
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        });

        // Handle forgot password
        const forgotPasswordLink = document.getElementById('forgot-password-link');
        forgotPasswordLink.addEventListener('click', function(e) {
            e.preventDefault();
            const email = prompt('กรุณาใส่อีเมลของคุณ:\n(ที่ตรงตามข้อมูลที่ใช้สมัครค้นทำการกู้คืน)');
            if (email && email.trim()) {
                // Validate email format
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (emailRegex.test(email.trim())) {
                    sendPasswordResetRequest(email.trim());
                } else {
                    alert('รูปแบบอีเมลไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง');
                }
            }
        });

        function sendPasswordResetRequest(userEmail) {
            // Log the request for admin reference
            console.log('Password reset requested for email:', userEmail);

            // Show contact information to user
            alert('สำหรับการรีเซ็ตรหัสผ่าน\nกรุณาติดต่อผู้ดูแลระบบโดยตรง\n\n' +
                  'Email: pur.admin@drugnetcenter.com\n' +
                  'อีเมลของคุณ: ' + userEmail + '\n\n' +
                  'ทีมงานจะดำเนินการให้ภายใน 24 ชั่วโมง');
        }
    </script>
</body>
</html>
